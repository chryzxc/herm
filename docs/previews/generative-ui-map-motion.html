<div id="herm-map-motion" class="viz-dotted-background" aria-label="Herm map motion study">
  <style>
    #herm-map-motion {
      --hm-canvas: light-dark(#f7f8fa, #10151e);
      --hm-surface: light-dark(#ffffff, #1a2230);
      --hm-text: light-dark(#202632, #e8edf5);
      --hm-secondary: light-dark(#647080, #a7b2c3);
      --hm-border: light-dark(#dde2e9, #354052);
      --hm-accent: light-dark(#3175cf, #6ec9eb);
      --hm-on-accent: light-dark(#ffffff, #0c2734);
      --hm-land: light-dark(#eeece7, #202a33);
      --hm-road: light-dark(#ffffff, #36424b);
      --hm-park: light-dark(#d6e6c8, #2b443c);
      --hm-grove: light-dark(#bfd5aa, #365547);
      --hm-water: light-dark(#badbe5, #304f60);
      --hm-path: light-dark(#f5f5df, #688071);
      --hm-map-label: light-dark(#536b50, #b3cbb9);
      --hm-travel: 480ms;
      --hm-ease: cubic-bezier(.2,.8,.2,1);
      color: var(--hm-text); padding: 18px;
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #herm-map-motion * { box-sizing: border-box; }
    #herm-map-motion .hm-caption {
      color: var(--hm-secondary); margin: 0 0 10px; font-size: 11px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    #herm-map-motion .hm-caption strong { color: var(--hm-text); font-weight: 500; }
    #herm-map-motion .hm-card {
      position: relative; height: 370px; overflow: hidden; isolation: isolate;
      background: var(--hm-canvas); border: 1px solid var(--hm-border); border-radius: 14px;
    }
    #herm-map-motion .hm-world {
      position: absolute; inset: -16px; transform-origin: 50% 48%;
      transition: transform var(--hm-travel) var(--hm-ease);
    }
    #herm-map-motion .hm-map { display: block; width: 100%; height: 100%; }
    #herm-map-motion .hm-roads { fill: none; stroke: var(--hm-road); stroke-width: 15; }
    #herm-map-motion .hm-trails { fill: none; stroke: var(--hm-path); stroke-width: 3; stroke-linecap: round; }
    #herm-map-motion .hm-map-label { position: absolute; color: var(--hm-map-label); font-size: 12px; }
    #herm-map-motion .hm-park-label { left: 38%; top: 31%; }
    #herm-map-motion .hm-lake-label { left: 63%; top: 29%; }
    #herm-map-motion .hm-route {
      fill: none; stroke: var(--hm-accent); stroke-width: 4;
      stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
      stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
      transition: opacity 160ms ease, stroke-dashoffset var(--hm-travel) var(--hm-ease);
    }
    #herm-map-motion .hm-route.is-selected { stroke-dashoffset: 0; opacity: 1; }
    #herm-map-motion button { font: inherit; color: var(--hm-text); -webkit-tap-highlight-color: transparent; }
    #herm-map-motion button:focus-visible { outline: 2px solid var(--hm-accent); outline-offset: 4px; }
    #herm-map-motion .hm-pin {
      position: absolute; padding: 7px 10px; min-height: 32px;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
      border-radius: 9px; border: 1px solid var(--hm-border); background: var(--hm-surface);
      transform: translate(-50%, -100%);
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
    }
    #herm-map-motion .hm-pin::after {
      content: ""; position: absolute; left: calc(50% - 4px); bottom: -11px;
      width: 8px; height: 8px; border: 2px solid var(--hm-surface);
      border-radius: 50%; background: var(--hm-secondary);
      transition: background 180ms ease, transform 220ms var(--hm-ease);
    }
    #herm-map-motion .hm-pin[aria-pressed="true"] {
      color: var(--hm-on-accent); background: var(--hm-accent); border-color: var(--hm-accent);
    }
    #herm-map-motion .hm-pin[aria-pressed="true"]::after { background: var(--hm-accent); transform: scale(1.15); }
    #herm-map-motion .hm-pin small { font-size: 11px; opacity: .8; }
    #herm-map-motion .hm-pin[data-place="boathouse"] { left: 67%; top: 49%; }
    #herm-map-motion .hm-pin[data-place="fern"] { left: 23%; top: 32%; }
    #herm-map-motion .hm-pin[data-place="lumen"] { left: 81%; top: 23%; }
    #herm-map-motion .hm-user {
      position: absolute; left: 31%; top: 72%; width: 12px; height: 12px;
      border-radius: 50%; background: var(--hm-accent); border: 3px solid var(--hm-surface);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--hm-accent) 15%, transparent);
    }
    #herm-map-motion .hm-detail {
      position: absolute; left: 12px; right: 12px; bottom: 12px;
      display: flex; align-items: center; gap: 14px;
      padding: 14px; min-height: 90px; background: var(--hm-surface);
      border: 1px solid var(--hm-border); border-radius: 10px;
    }
    #herm-map-motion .hm-copy { flex: 1; min-width: 0; }
    #herm-map-motion .hm-name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    #herm-map-motion .hm-description { color: var(--hm-secondary); font-size: 12px; }
    #herm-map-motion .hm-walk { display: none; color: var(--hm-secondary); font-size: 12px; }
    #herm-map-motion .hm-traits { color: var(--hm-secondary); font-size: 11px; margin-top: 7px; }
    #herm-map-motion .hm-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    #herm-map-motion .hm-count { min-width: 32px; text-align: center; color: var(--hm-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
    #herm-map-motion .hm-nav {
      min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center;
      border: 1px solid var(--hm-border); border-radius: 7px; background: var(--hm-canvas);
      transition: background 160ms ease, transform 160ms var(--hm-ease);
    }
    #herm-map-motion .hm-nav:hover { background: color-mix(in srgb, var(--hm-accent) 12%, var(--hm-surface)); }
    #herm-map-motion .hm-nav:active { transform: scale(.96); }
    #herm-map-motion.hm-instant *, #herm-map-motion.hm-reduced * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    #herm-map-motion.hm-instant *::after, #herm-map-motion.hm-reduced *::after { transition: none !important; }
    @media (prefers-reduced-motion: reduce) {
      #herm-map-motion *, #herm-map-motion *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 480px) {
      #herm-map-motion { padding: 12px; }
      #herm-map-motion .hm-card { height: 350px; }
      #herm-map-motion .hm-detail { left: 8px; right: 8px; bottom: 8px; padding: 12px; gap: 6px; }
      #herm-map-motion .hm-controls { gap: 1px; }
      #herm-map-motion .hm-traits { display: none; }
      #herm-map-motion .hm-description { display: none; }
      #herm-map-motion .hm-walk { display: block; }
      #herm-map-motion .hm-pin { padding: 6px 8px; font-size: 11px; }
      #herm-map-motion .hm-pin small { display: none; }
      #herm-map-motion .hm-pin[data-place="lumen"] { transform: translate(-100%, -100%); }
      #herm-map-motion .hm-pin[data-place="lumen"]::after { left: calc(100% - 4px); }
      #herm-map-motion .hm-map-label { font-size: 11px; }
    }
    @media (pointer: coarse) {
      #herm-map-motion .hm-nav { min-width: 44px; height: 44px; }
      #herm-map-motion .hm-pin { min-height: 44px; }
    }
  </style>
  <div class="hm-caption"><strong>Map · motion study</strong><span>Illustrative places</span></div>
  <section class="hm-card" aria-label="Places around Linden Park">
    <div class="hm-world">
      <svg class="hm-map" viewBox="0 0 960 520" preserveAspectRatio="none" role="img" aria-labelledby="hm-map-title hm-map-desc">
        <title id="hm-map-title">Illustrative Linden Park map</title>
        <desc id="hm-map-desc">Three fictional cafés around a lake. Select a place to change the route and its details.</desc>
        <rect width="960" height="520" fill="var(--hm-land)"/>

        <path d="M292 70Q310 35 373 35L779 4Q825 6 834 46L871 251Q880 276 844 288L376 346Q350 353 344 317Z" fill="var(--hm-park)"/>
        <g fill="var(--hm-grove)">
          <ellipse cx="411" cy="115" rx="73" ry="46"/><ellipse cx="727" cy="74" rx="76" ry="44"/>
          <ellipse cx="754" cy="235" rx="79" ry="37"/><ellipse cx="465" cy="285" rx="81" ry="32"/>

        <g aria-hidden="true">
          <path class="hm-route is-selected" data-route="boathouse" pathLength="1" d="M298 374L414 361L541 347L579 342Q588 339 586 328L587 311Q588 300 599 296L643 263"/>
          <path class="hm-route" data-route="fern" pathLength="1" d="M298 374L278 265L263 188Q260 175 247 172L221 174"/>
          <path class="hm-route" data-route="lumen" pathLength="1" d="M298 374L414 361L541 347L699 329L844 312Q859 311 857 294L840 209L828 147Q827 134 815 132L778 129"/>
        </g>
      </svg>
      <span class="hm-map-label hm-park-label" aria-hidden="true">Linden Park</span>
      <span class="hm-map-label hm-lake-label" aria-hidden="true">Linden Lake</span>
      <div class="hm-user" role="img" aria-label="Example starting point"></div>
      <button class="hm-pin cursor-interaction" data-place="boathouse" type="button" aria-pressed="true" aria-label="Select The Boathouse, 5 minute example walk">The Boathouse <small>5 min</small></button>
      <button class="hm-pin cursor-interaction" data-place="fern" type="button" aria-pressed="false" aria-label="Select Fern and Fig, 4 minute example walk">Fern &amp; Fig <small>4 min</small></button>
      <button class="hm-pin cursor-interaction" data-place="lumen" type="button" aria-pressed="false" aria-label="Select Lumen Coffee, 9 minute example walk">Lumen Coffee <small>9 min</small></button>
    </div>
    <div class="hm-detail">
      <div class="hm-copy" aria-live="polite" aria-atomic="true">
        <div class="hm-name">The Boathouse</div><div class="hm-description">Lakeside café · 5 min walk</div>
        <div class="hm-walk">5 min walk</div>
        <div class="hm-traits">Quiet mornings · Outlets · Lake view</div>
      </div>
      <div class="hm-controls" aria-label="Compare places">
        <button class="hm-nav cursor-interaction" data-step="-1" type="button" aria-label="Previous place">Prev</button>
        <span class="hm-count">1 / 3</span>
        <button class="hm-nav cursor-interaction" data-step="1" type="button" aria-label="Next place">Next</button>
      </div>
    </div>
  </section>
  <script>
    (() => {
      const root = document.getElementById("herm-map-motion");
      const places = [
        {id:"boathouse",name:"The Boathouse",description:"Lakeside café",walk:"5 min walk",traits:"Quiet mornings · Outlets · Lake view",camera:"translate(-1%, 1%) scale(1.035)"},
        {id:"fern",name:"Fern & Fig",description:"Neighbourhood café",walk:"4 min walk",traits:"Quiet corners · Large tables · Street view",camera:"translate(2%, 2%) scale(1.035)"},
        {id:"lumen",name:"Lumen Coffee",description:"Parkside café",walk:"9 min walk",traits:"Fast Wi-Fi · Outlets · Afternoon sun",camera:"translate(-2%, 3%) scale(1.035)"}
      ];
      const options = {reducedMotion:false,travelDuration:480};
      const world = root.querySelector(".hm-world"), copy = root.querySelector(".hm-copy");
      const media = window.matchMedia("(prefers-reduced-motion: reduce)");
      let current = 0;
      function motionAllowed() { return !options.reducedMotion && !media.matches; }
      function applyOptions() {
        root.classList.toggle("hm-reduced", options.reducedMotion || media.matches);
        root.style.setProperty("--hm-travel", options.travelDuration + "ms");
        if (!motionAllowed()) copy.getAnimations().forEach(a => a.cancel());
      }
      function save() {
        const promise = window.openai?.setWidgetState?.({
          modelContent:{preview:"Herm map motion study",selectedPlace:places[current].name},
          privateContent:{selected:places[current].id,reducedMotion:options.reducedMotion,travelDuration:options.travelDuration}
        });
        promise?.catch(() => {});
      }
      function select(index, animate, persist) {
        const previous = current;
        current = (index + places.length) % places.length;
        const place = places[current];
        copy.getAnimations().forEach(a => a.cancel());
        root.querySelectorAll("[data-place]").forEach(el => el.setAttribute("aria-pressed",String(el.dataset.place === place.id)));
        root.querySelectorAll("[data-route]").forEach(el => el.classList.toggle("is-selected",el.dataset.route === place.id));
        world.style.transform = place.camera;
        root.querySelector(".hm-name").textContent = place.name;
        root.querySelector(".hm-description").textContent = place.description + " · " + place.walk;
        root.querySelector(".hm-walk").textContent = place.walk;
        root.querySelector(".hm-traits").textContent = place.traits;
        root.querySelector(".hm-count").textContent = (current + 1) + " / " + places.length;
        if (animate && previous !== current && motionAllowed()) {
          const dx = current > previous ? 6 : -6;
          copy.animate([{opacity:.55,transform:"translateX(" + dx + "px)"},{opacity:1,transform:"translateX(0)"}],
            {duration:200,easing:"cubic-bezier(.2,.8,.2,1)"});
        }
        if (persist) save();
      }
      function restore(saved) {
        const data = saved?.privateContent;
        if (data) {
          options.reducedMotion = data.reducedMotion === true;
          if (Number.isFinite(data.travelDuration)) options.travelDuration = Math.min(650,Math.max(300,data.travelDuration));
          const index = places.findIndex(p => p.id === data.selected);
          if (index >= 0) current = index;
        }
        applyOptions();
        root.classList.add("hm-instant");
        select(current,false,false);
        requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("hm-instant")));
      }
      root.querySelectorAll("[data-place]").forEach(el => el.addEventListener("click",() => select(places.findIndex(p => p.id === el.dataset.place),true,true)));
      root.querySelectorAll("[data-step]").forEach(el => el.addEventListener("click",() => select(current + Number(el.dataset.step),true,true)));
      media.addEventListener("change",applyOptions);
      window.addEventListener("openai:set_globals",event => {
        const saved = event.detail?.globals?.widgetState, data = saved?.privateContent;
        if (!data) return;
        // Saving local state may echo it back; keep an in-flight transition intact.
        if (data.selected === places[current].id && (data.reducedMotion === true) === options.reducedMotion
            && data.travelDuration === options.travelDuration) return;
        restore(saved);
      });
      restore(window.openai?.widgetState);
      if (globalThis.Tweak) {
        const tweak = new Tweak({container:root,onChange:() => {applyOptions();save();}});
        tweak.addToggle(options,"reducedMotion",{label:"Reduce motion"});
        tweak.addSlider(options,"travelDuration",{label:"Map transition",min:300,max:650,step:50,unit:"ms"});
      }
    })();
  </script>
</div>
