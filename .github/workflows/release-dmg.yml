name: Release macOS DMG

on:
  # Auto-release: every green CI run on main ships the next patch version.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 1.2.3)"
        required: true
        type: string
      source_ref:
        description: "Git ref to package (optional; defaults to the workflow ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event_name == 'workflow_run' && 'auto' || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and release macOS DMG
    runs-on: macos-26
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if git tag --points-at HEAD | grep -q '^v'; then
              echo "HEAD is already released; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            LATEST="${LATEST:-v0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi

          if ! ruby -e '
            semver = /\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)
              (?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?
              (?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\z/x
            abort unless semver.match?(ARGV.fetch(0))
          ' "$VERSION"; then
            echo "Invalid release version: $VERSION" >&2
            echo "Expected strict semantic version format such as 1.2.3, 1.2.3-rc.1, or 1.2.3+build.1" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run release test suite
        if: github.event_name != 'workflow_run' && steps.version.outputs.skip != 'true'
        run: swift test

      - name: Build versioned DMG
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: Scripts/package-app.sh "$VERSION"

      - name: Verify DMG
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Herm.dmg
          hdiutil imageinfo dist/Herm.dmg >/dev/null
          echo "Built Herm-${VERSION}.dmg ($(du -h dist/Herm.dmg | cut -f1))"

      - name: Upload DMG artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Herm-${{ steps.version.outputs.value }}-dmg
          path: dist/Herm.dmg
          if-no-files-found: error

      - name: Create or update GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --generate-notes; then
              # Another tag/manual run may have created it concurrently.
              gh release view "$TAG" >/dev/null
            fi
          fi
          gh release upload "$TAG" dist/Herm.dmg --clobber
