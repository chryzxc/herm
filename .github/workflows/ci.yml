name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Guard, tests and the release build run side by side; `verify` is the single required check.
jobs:
  guard:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard
        run: make guard

      - name: Check launcher scripts
        run: sh -n Scripts/run-debug-app.sh Scripts/build-and-run-app.sh

  # Suites are split across shards balanced by test count; bump `total` to add runners.
  test:
    name: test (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        total: [4]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Dependency builds are reused until Package.resolved or the Swift toolchain changes.
      - name: Restore SwiftPM build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        run: Scripts/test-shard.sh ${{ matrix.shard }} ${{ matrix.total }}

  release-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}

      - name: Release build
        run: make build-release

      # PR builds reuse the release build above, so reviewers can install the change.
      - name: Package PR build
        if: github.event_name == 'pull_request'
        env:
          HERM_BUILD_CHANNEL: nightly
          HERM_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: Scripts/package-app.sh

      - name: Upload PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Herm-pr-${{ github.event.pull_request.number }}
          path: dist/Herm.dmg
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guard, test, release-build]
    if: always()
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "guard, test, release-build: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
