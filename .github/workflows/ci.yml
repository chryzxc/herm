name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer PR push supersedes the older run, but every main commit keeps its own run:
# Release Please and the stable DMG need green CI on the exact release commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Guard and tests gate PRs; main pushes also run the release build. `verify` is the single required check.
jobs:
  guard:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard
        run: make guard

      - name: Check launcher scripts
        run: |
          sh -n Scripts/run-debug-app.sh
          sh -n Scripts/build-and-run-app.sh
          sh -n Scripts/package-app.sh

  # Build once, then run balanced shards in separate serial processes to avoid UI contention.
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Dependency builds are reused until Package.resolved or the Swift toolchain changes.
      - name: Restore SwiftPM build cache
        id: debug-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}

      - name: Build tests
        id: build-tests
        run: Scripts/test-shard.sh --build-only

      - name: Test shard 0/3
        id: shard-0
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: Scripts/test-shard.sh 0 3 --skip-build

      - name: Test shard 1/3
        id: shard-1
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: Scripts/test-shard.sh 1 3 --skip-build

      - name: Test shard 2/3
        id: shard-2
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: Scripts/test-shard.sh 2 3 --skip-build

      # Match the old matrix: save a miss when any shard succeeded, even if another failed.
      - name: Save SwiftPM build cache
        if: ${{ !cancelled() && steps.debug-cache.outputs.cache-hit != 'true' && (steps.shard-0.outcome == 'success' || steps.shard-1.outcome == 'success' || steps.shard-2.outcome == 'success') }}
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: ${{ steps.debug-cache.outputs.cache-primary-key }}

  # The ~25 min optimized build runs only on main pushes, so PRs are not gated on it. A
  # release-only compile failure surfaces on main and holds back the nightly and releases.
  release-build:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}

      - name: Build and stage the release app
        run: HERM_RELEASE_APP_ARCHIVE="$RUNNER_TEMP/herm-release-app.tar.gz" Scripts/package-app.sh

      - name: Upload the release app for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herm-release-app
          path: ${{ runner.temp }}/herm-release-app.tar.gz
          if-no-files-found: error
          compression-level: 0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guard, test, release-build]
    if: always()
    steps:
      - name: Require every job to pass
        env:
          GUARD: ${{ needs.guard.result }}
          TEST: ${{ needs.test.result }}
          RELEASE: ${{ needs.release-build.result }}
          EVENT: ${{ github.event_name }}
        # release-build is skipped on PRs by design; anywhere else it must pass.
        run: |
          echo "guard=$GUARD test=$TEST release-build=$RELEASE"
          [ "$GUARD" = success ] && [ "$TEST" = success ] || exit 1
          [ "$RELEASE" = success ] || { [ "$EVENT" = pull_request ] && [ "$RELEASE" = skipped ]; }
