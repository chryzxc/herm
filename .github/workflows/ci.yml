name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Lint, contracts and diff checks need no build, so they fail in about a minute.
      - name: Guard
        run: make guard

      - name: Identify toolchain
        id: toolchain
        run: echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Dependency builds are reused until Package.resolved or the Swift toolchain changes.
      - name: Restore SwiftPM build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        run: make test

      - name: Check launcher scripts
        run: sh -n Scripts/run-debug-app.sh Scripts/build-and-run-app.sh

      - name: Release build
        run: make build-release
